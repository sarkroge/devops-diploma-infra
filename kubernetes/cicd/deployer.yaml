apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-deployer
  namespace: diploma
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-deployer
  namespace: diploma
rules:
  - apiGroups: [apps]
    resources: [deployments]
    resourceNames: [diploma-app]
    verbs: [get, list, watch, patch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-deployer
  namespace: diploma
subjects:
  - kind: ServiceAccount
    name: github-deployer
    namespace: diploma
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-deployer
---
apiVersion: v1
kind: Secret
metadata:
  name: github-deployer-token
  namespace: diploma
  annotations:
    kubernetes.io/service-account.name: github-deployer
type: kubernetes.io/service-account-token
