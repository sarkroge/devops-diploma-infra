---
- name: Prepare all Kubernetes nodes
  hosts: all
  become: true
  gather_facts: false
  any_errors_fatal: true
  pre_tasks:
    - name: Wait for SSH and Python
      ansible.builtin.wait_for_connection:
        timeout: 300
        connect_timeout: 10
        sleep: 5

    - name: Wait for cloud-init
      ansible.builtin.command: cloud-init status --wait
      changed_when: false

    - name: Gather system facts
      ansible.builtin.setup:

    - name: Verify the supported OS and architecture
      ansible.builtin.assert:
        that:
          - ansible_facts.distribution == 'Ubuntu'
          - ansible_facts.distribution_version == '24.04'
          - ansible_facts.architecture == 'x86_64'
        fail_msg: This playbook targets the Ubuntu 24.04 amd64 image used by Terraform.
  roles:
    - node

- name: Initialize the control plane and install the pod network
  hosts: control_plane
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - control_plane

- name: Join worker nodes
  hosts: workers
  become: true
  gather_facts: false
  any_errors_fatal: true
  roles:
    - worker

- name: Verify the cluster and retrieve access configuration
  hosts: control_plane
  become: true
  gather_facts: false
  roles:
    - verify
