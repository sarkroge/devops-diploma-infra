---
- name: Check whether kubelet is already configured
  ansible.builtin.stat:
    path: /etc/kubernetes/kubelet.conf
  register: kubelet_config

- name: Check available root filesystem space
  ansible.builtin.command: df -B1 --output=avail /
  register: root_space
  changed_when: false

- name: Check space before initial installation
  ansible.builtin.assert:
    that:
      - root_space.stdout_lines[-1] | trim | int >= 3221225472
    fail_msg: Less than 3 GiB is free on the root disk; inspect disk usage before installing.
  when: not kubelet_config.stat.exists

- name: Disable active swap
  ansible.builtin.command: swapoff -a
  when: ansible_facts.swaptotal_mb | int > 0

- name: Disable swap entries in fstab
  ansible.builtin.replace:
    path: /etc/fstab
    regexp: '^([^#\n]+\s+swap\s+[^\n]*)$'
    replace: '# \1'

- name: Persist kernel modules
  ansible.builtin.copy:
    dest: /etc/modules-load.d/kubernetes.conf
    content: "overlay\nbr_netfilter\n"
    mode: "0644"

- name: Load kernel modules
  ansible.builtin.command: "modprobe {{ item }}"
  loop:
    - overlay
    - br_netfilter
  changed_when: false

- name: Persist network sysctls
  ansible.builtin.copy:
    dest: /etc/sysctl.d/99-kubernetes.conf
    content: |
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-iptables = 1
      net.bridge.bridge-nf-call-ip6tables = 1
    mode: "0644"

- name: Apply network sysctls
  ansible.builtin.command: sysctl --system
  changed_when: false

- name: Install prerequisites
  ansible.builtin.apt:
    name:
      - ca-certificates
      - curl
      - gnupg
      - python3-apt
      - conntrack
      - socat
      - iptables
    state: present
    update_cache: true
    cache_valid_time: 3600
    lock_timeout: 300

- name: Create apt keyring directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Docker repository signing key
  ansible.builtin.get_url:
    url: https://download.docker.com/linux/ubuntu/gpg
    dest: /etc/apt/keyrings/docker.asc
    mode: "0644"
    timeout: 60
  register: docker_key
  retries: 3
  delay: 5
  until: docker_key is succeeded

- name: Configure repository for containerd packages
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/docker.list
    content: "deb [arch=amd64 signed-by=/etc/apt/keyrings/docker.asc] https://download.docker.com/linux/ubuntu noble stable\n"
    mode: "0644"

- name: Download Kubernetes repository signing key
  ansible.builtin.get_url:
    url: "https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/Release.key"
    dest: /etc/apt/keyrings/kubernetes.asc
    mode: "0644"
    timeout: 60
  register: kubernetes_key
  retries: 3
  delay: 5
  until: kubernetes_key is succeeded

- name: Configure Kubernetes repository
  ansible.builtin.copy:
    dest: /etc/apt/sources.list.d/kubernetes.list
    content: "deb [signed-by=/etc/apt/keyrings/kubernetes.asc] https://pkgs.k8s.io/core:/stable:/v{{ kubernetes_minor }}/deb/ /\n"
    mode: "0644"

- name: Install pinned containerd and Kubernetes packages
  ansible.builtin.apt:
    name:
      - "containerd.io={{ containerd_deb_version }}"
      - "kubelet={{ kubernetes_deb_version }}"
      - "kubeadm={{ kubernetes_deb_version }}"
      - "kubectl={{ kubernetes_deb_version }}"
    state: present
    update_cache: true
    lock_timeout: 300
    allow_change_held_packages: true
  register: kubernetes_packages
  retries: 3
  delay: 10
  until: kubernetes_packages is succeeded

- name: Hold the installed package versions
  ansible.builtin.dpkg_selections:
    name: "{{ item }}"
    selection: hold
  loop:
    - containerd.io
    - kubelet
    - kubeadm
    - kubectl

- name: Get the sandbox image required by this kubeadm version
  ansible.builtin.command:
    argv:
      - kubeadm
      - config
      - images
      - list
      - --kubernetes-version
      - "{{ kubernetes_version }}"
  register: kubeadm_images
  changed_when: false

- name: Record the sandbox image
  ansible.builtin.set_fact:
    sandbox_image: "{{ kubeadm_images.stdout_lines | select('search', '/pause:') | first }}"

- name: Create containerd configuration directory
  ansible.builtin.file:
    path: /etc/containerd
    state: directory
    mode: "0755"

- name: Configure containerd with systemd cgroups
  ansible.builtin.template:
    src: containerd.toml.j2
    dest: /etc/containerd/config.toml
    mode: "0644"
  notify: Restart containerd

- name: Configure crictl
  ansible.builtin.copy:
    dest: /etc/crictl.yaml
    content: |
      runtime-endpoint: {{ cri_socket }}
      image-endpoint: {{ cri_socket }}
      timeout: 10
      debug: false
    mode: "0644"

- name: Bind kubelet to its private node address
  ansible.builtin.copy:
    dest: /etc/default/kubelet
    content: "KUBELET_EXTRA_ARGS=--node-ip={{ node_ip }}\n"
    mode: "0644"
  notify: Restart kubelet

- name: Enable containerd and kubelet
  ansible.builtin.systemd_service:
    name: "{{ item }}"
    enabled: true
  loop:
    - containerd
    - kubelet

- name: Apply runtime changes before kubeadm
  ansible.builtin.meta: flush_handlers

- name: Ensure containerd is running
  ansible.builtin.systemd_service:
    name: containerd
    state: started
