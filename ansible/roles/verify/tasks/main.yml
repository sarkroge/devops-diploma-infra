---
- name: Wait until all nodes are Ready
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - wait
      - --for=condition=Ready
      - nodes
      - --all
      - --timeout=600s
  changed_when: false

- name: Read the registered nodes
  ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o json
  register: registered_nodes
  changed_when: false

- name: Verify the expected number of nodes
  ansible.builtin.assert:
    that:
      - ((registered_nodes.stdout | from_json)['items'] | length) == (groups['all'] | length)
    fail_msg: Not all inventory nodes have registered in Kubernetes.

- name: Label worker nodes
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - label
      - node
      - "{{ item }}"
      - node-role.kubernetes.io/worker=
      - --overwrite
  loop: "{{ groups['workers'] }}"
  register: worker_labels
  changed_when: "'not labeled' not in worker_labels.stdout"

- name: Wait for Flannel rollout
  ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-flannel rollout status daemonset/kube-flannel-ds --timeout=600s
  changed_when: false

- name: Wait for CoreDNS rollout
  ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf -n kube-system rollout status deployment/coredns --timeout=600s
  changed_when: false

- name: Print node status
  ansible.builtin.command: kubectl --kubeconfig=/etc/kubernetes/admin.conf get nodes -o wide
  register: final_nodes
  changed_when: false

- name: Show node status
  ansible.builtin.debug:
    var: final_nodes.stdout_lines

- name: Retrieve admin kubeconfig to the private local directory
  ansible.builtin.fetch:
    src: /etc/kubernetes/admin.conf
    dest: "{{ playbook_dir }}/../.secrets/kubeconfig-internal"
    flat: true
  no_log: true
