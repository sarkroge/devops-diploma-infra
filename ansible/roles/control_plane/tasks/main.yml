---
- name: Create the Kubernetes configuration directory
  ansible.builtin.file:
    path: /etc/kubernetes
    state: directory
    mode: "0755"

- name: Write kubeadm configuration
  ansible.builtin.template:
    src: kubeadm-config.yaml.j2
    dest: /etc/kubernetes/kubeadm-config.yaml
    mode: "0600"

- name: Initialize the control plane once
  ansible.builtin.command:
    argv:
      - kubeadm
      - init
      - --config
      - /etc/kubernetes/kubeadm-config.yaml
    creates: /etc/kubernetes/admin.conf
  no_log: true

- name: Download the pinned Flannel manifest
  ansible.builtin.get_url:
    url: "https://github.com/flannel-io/flannel/releases/download/{{ flannel_version }}/kube-flannel.yml"
    dest: /etc/kubernetes/kube-flannel.yml
    mode: "0644"
    timeout: 90
  register: flannel_manifest
  retries: 3
  delay: 10
  until: flannel_manifest is succeeded

- name: Install the Flannel pod network
  ansible.builtin.command:
    argv:
      - kubectl
      - --kubeconfig=/etc/kubernetes/admin.conf
      - apply
      - -f
      - /etc/kubernetes/kube-flannel.yml
  register: flannel_apply
  changed_when: "'created' in flannel_apply.stdout or 'configured' in flannel_apply.stdout"

- name: Generate a short-lived join command when a worker needs it
  ansible.builtin.command: kubeadm token create --ttl 2h --print-join-command
  register: kubeadm_join
  no_log: true
  when: >-
    groups['workers'] | map('extract', hostvars, 'kubelet_config') |
    map(attribute='stat.exists') | select('equalto', false) | list | length > 0
